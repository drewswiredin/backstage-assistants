events {}

http {
  # Round robin, so consecutive requests (a chat, its resume, its status
  # checks) land on different replicas.
  upstream backend {
    server 127.0.0.1:7008;
    server 127.0.0.1:7009;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 7007;
    client_max_body_size 50m;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      # Signals is a WebSocket.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      # Chat replies stream; pass them through as they come.
      proxy_buffering off;
      proxy_read_timeout 1h;
      # Which replica answered (DevTools, Network tab).
      add_header X-Backstage-Replica $upstream_addr always;
    }
  }
}

apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: backstage-mcp-server
  description: An MCP server that exposes tools related to the Backstage ecosystem
  tags:
    - mcp
    - ai
  links:
    - url: http://localhost:7007/api/mcp-actions/v1
      title: Streamable HTTP endpoint
spec:
  type: mcp-server
  lifecycle: experimental
  owner: team-a
  definition: |
    MCP server (Streamable HTTP) at /api/mcp-actions/v1 on the Backstage
    backend. It lists the actions registered with the actions registry, such
    as catalog queries and template execution, as MCP tools.

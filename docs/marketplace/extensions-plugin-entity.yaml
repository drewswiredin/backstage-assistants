  description: |
    AI chat assistants in a collapsible Backstage side panel. An assistant's tools are Backstage actions
    and MCP server tools, executed as the signed-in user, so every call carries that user's identity and
    permissions. Each tool call is gated behind an Allow / Deny prompt in the chat.

    Admins create and manage assistants in an in-app editor: prompt, model, tools, and who can use it.
    Definitions live in the plugin database, so adding or changing an assistant is a save, not a deploy.
  installation: |
    Requires the Backstage new frontend system and new backend system: Backstage 1.53 or later, Node 22.12 or later.
    On Red Hat Developer Hub this means RHDH 1.10 or later with `APP_CONFIG_app_packageName=app-next` and
    `ENABLE_STANDARD_MODULE_FEDERATION=true`. The plugin does not mount on the default (legacy) RHDH shell.

    ```sh
    yarn --cwd packages/app add @drewswiredin/backstage-plugin-assistants
    yarn --cwd packages/backend add @drewswiredin/backstage-plugin-assistants-backend
    ```

    Configure a model provider under `assistants:` in app-config. The project README covers the full setup:
    https://github.com/drewswiredin/backstage-assistants#readme

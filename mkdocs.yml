site_name: AI Assistants for Backstage
site_url: https://drewswiredin.github.io/backstage-assistants/
site_description: >-
  Chat assistants that answer from your catalog and TechDocs, and run Backstage
  actions and MCP tools as the signed-in user.
repo_url: https://github.com/drewswiredin/backstage-assistants
edit_uri: edit/main/docs/
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Chat page, panel, and homepage: frontend.md
  - Configure:
      - Model providers: providers.md
      - Actions and tools: tools.md
      - MCP servers: mcp.md
      - Approvals: approvals.md
      - Permissions: permissions.md
      - Semantic search: semantic-search.md
  - Operate:
      - Run in production: production.md
      - Security: security.md
      - Reference: reference.md
  - Extend:
      - Client tools: client-tools.md
  - Contributing:
      - Architecture: architecture.md
      - Principles: PRINCIPLES.md
      - Releasing: RELEASING.md
exclude_docs: |
  media/
  marketplace/
  images/README.md
plugins:
  - techdocs-core
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  anchors: warn
